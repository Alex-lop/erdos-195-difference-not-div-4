status:
  scope: >-
    Fully formalizes the theorem that some permutation of ℤ has no monotone 4-term arithmetic
    progression whose common difference is not divisible by 4, in two equivalent phrasings. It
    does not treat differences divisible by 4, which do occur in this permutation, and it does
    not resolve Erdős #195. The remarks in docs/proof.md on the sharpness of the margin constant
    1/7, on other parameter choices and on why the method stops at differences divisible by 4
    are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5)", "Fable 5.1"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code agents in an unattended research run on open Erdős problems: an orchestrating
        workflow, research subagents that searched for constructions with Python and C, three
        adversarial referee subagents (proof, computation, scope) that checked the informal
        argument with independent code, and a formalization subagent. On the orchestrating
        agent's suggestion (any C >= 1352 in T_k = C·2^k removes the finite computer check of
        the informal proof), the formalization subagent used T_k = 2048·2^k and wrote the Lean proof, iterating with the Lean compiler (omega for
        the case analyses, nlinarith and linarith for the rank arithmetic).
      cost:
        wall_time: "about 2 hours for the research round, the referee round and the formalization"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        The user asked Claude to find and fully solve an open Erdős problem, formalize it in Lean
        and publish it, falling back to rigorous partial results labelled as partial when no full
        solution survives verification. No full solution was found. An earlier round had named
        differences not divisible by 4 as the next step after the odd-difference result. The
        workflow prompts required honest labelling, independent verification, and Lean proofs
        without sorry, native_decide or new axioms.
  spend_usd: "subscription-based"
  notes: >-
    The mathematics, the write-up and the Lean code were produced by Claude Opus 5.5 and Fable 5.1
    (Anthropic) in Claude Code under the direction of Alex Lopez. The informal argument was checked
    by three adversarial AI referees; the formal proof is checked by the Lean kernel. No human has
    refereed the work.

fidelity:
  divergences: "none known"

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statements in Challenge.lean and Solution.lean were checked to elaborate to byte-identical
    terms (pp.all), and #print axioms reports only propext, Classical.choice and Quot.sound for both
    theorems. The informal proof (with threshold 100·2^k and a finite check) was checked by three
    adversarial AI referees, and the construction was checked numerically on windows of integers.
    The informal proof has not been refereed by a human.

alignment:
  namespace: "Erdos195Depth2"
  statements:
    - source: "docs/proof.md, Theorem 1"
      lean: "Erdos195Depth2.main_result"
      module: "Challenge"
      status: "proved"
      note: "Indices i < j < k < l and values a, a + d, a + 2d, a + 3d with ¬ 4 ∣ d; a negative d covers decreasing progressions."
    - source: "docs/proof.md, Theorem 1 (formal-conjectures phrasing)"
      lean: "Erdos195Depth2.main_result_list"
      module: "Challenge"
      status: "proved"
      note: "Same theorem phrased like HasMonotoneAP f 4 from formal-conjectures, restricted to common differences not divisible by 4."

acknowledgements: "Lean 4 and Mathlib; the formal-conjectures project for the statement of Erdős #195; the Palomar template for the repository layout; the published odd-difference repository for the order P."
