version: "v0.4"

project:
  name: "A permutation of the integers with no monotone 4-term AP whose difference is not divisible by 4 (Erdős #195, partial)"
  description: >-
    Constructs an explicit bijection f : ℕ ≃ ℤ such that no indices i < j < k < l give an
    arithmetic progression f i, f j, f k, f l, increasing or decreasing, whose common difference
    is not divisible by 4 (that is, odd or congruent to 2 mod 4). The even numbers are listed in
    stages about moving half-integer centres, each stage followed by one odd number, so that the
    evens placed before each odd number are symmetric about it (this kills odd differences). The
    odd numbers follow the published odd-difference order, and the evens follow a drifting-centre
    key order with no odd-difference AP. This extends the odd-difference theorem of
    Alex-lop/erdos-195-odd-difference. It is partial progress on Erdős Problem #195, which remains
    open: it asks whether every permutation of ℤ contains a monotone 4-term arithmetic progression
    of any difference, and progressions with difference divisible by 4 do occur in this
    permutation.
  authors:
    - "Alex Lopez"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Alex Lopez"

